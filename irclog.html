<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>#pulina IrcScroller</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<style>
@font-face {
  font-family: 'SF Mono';
  src: url('fonts/sfmono-regular.woff2') format('woff2'), url('fonts/sfmono-regular.woff') format('woff');
}

@font-face {
  font-family: 'SF Mono';
  font-weight: 700;
  src: url('fonts/sfmono-bold.woff2') format('woff2'), url('fonts/sfmono-bold.woff') format('woff');
}

@font-face {
  font-family: 'SF Mono';
  font-weight: 300;
  src: url('fonts/sfmono-light.woff2') format('woff2'), url('fonts/sfmono-light.woff') format('woff');
}

html {
  background: #0c162d;
  overflow-x: hidden;
  scrollbar-gutter: stable;
}

/* Firefox only, Chromium would draw arrow buttons with these */
@supports not selector(::-webkit-scrollbar) {
  html {
    scrollbar-color: transparent #0c162d;
    scrollbar-width: thin;
  }

  html.scrolling {
    scrollbar-color: rgba(98, 114, 164, .5) #0c162d;
  }
}

html::-webkit-scrollbar {
  height: 0;
  width: 6px;
}

html::-webkit-scrollbar-track {
  background: #0c162d;
}

html::-webkit-scrollbar-thumb {
  background: transparent;
  border-radius: 3px;
}

html.scrolling::-webkit-scrollbar-thumb {
  background: rgba(98, 114, 164, .5);
}

body {
  color: rgba(248, 248, 242, .77);
  font: 14px 'SF Mono', Menlo, ui-monospace, monospace;
  line-height: 1.6;
  margin: 8px 8px 20px;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

a {
  color: #3498db;
  font-size: inherit;
  line-height: inherit;
  text-decoration: none;
}

a:hover {
  color: #1abc9c;
  text-decoration: underline;
}

.timestamp {
  color: rgba(98, 114, 164, .5);
}

.work-tr {
  display: flex;
  margin: 2px 0;
  padding-right: 10px;
}

.time-td {
  font-weight: 300;
  margin-left: auto;
  order: 3;
  padding-left: 10px;
  padding-right: 20px;
}

.nick-td {
  font-weight: 700;
  margin-right: 10px;
  min-width: 125px;
  order: 1;
  overflow: hidden;
  text-align: right;
  width: 125px;
}

.msg-td {
  font-weight: 300;
  min-width: 0;
  order: 2;
}

.msg-td,
.msg-td span,
.msg-td a {
  overflow-wrap: anywhere;
  word-break: break-word;
}

.msg-td {
  white-space: pre-wrap;
}

.bang {
  color: #454849;
}

.bang strong {
  color: #3498db;
}

/* mIRC formatting */
.b { font-weight: 700; }
.i { font-style: italic; }
.u { text-decoration: underline; }
.s { text-decoration: line-through; }
.r { background: rgba(248, 248, 242, .77); color: #0c162d; }
.fg0 { color: #fff; }
.fg1 { color: #000; }
.fg2 { color: #00007f; }
.fg3 { color: #5ec73e; }
.fg4 { color: #f00; }
.fg5 { color: #7f0000; }
.fg6 { color: #7f007f; }
.fg7 { color: #ff7f00; }
.fg8 { color: #ff0; }
.fg9 { color: #0f0; }
.fg10 { color: #3f7f7f; }
.fg11 { color: #0ff; }
.fg12 { color: #00f; }
.fg13 { color: #f0f; }
.fg14 { color: #7f7f7f; }
.fg15 { color: #bfbfbf; }
.bg0 { background-color: #fff; }
.bg1 { background-color: #000; }
.bg2 { background-color: #00007f; }
.bg3 { background-color: #5ec73e; }
.bg4 { background-color: #f00; }
.bg5 { background-color: #7f0000; }
.bg6 { background-color: #7f007f; }
.bg7 { background-color: #ff7f00; }
.bg8 { background-color: #ff0; }
.bg9 { background-color: #0f0; }
.bg10 { background-color: #3f7f7f; }
.bg11 { background-color: #0ff; }
.bg12 { background-color: #00f; }
.bg13 { background-color: #f0f; }
.bg14 { background-color: #7f7f7f; }
.bg15 { background-color: #bfbfbf; }

@media (max-width: 760px) {
  body {
    font-size: 13px;
  }
}

@media (max-width: 500px) {
  body {
    font-size: 12px;
  }
}
</style>
</head>
<body>
<div id="log"></div>
<script src="irclog.js?v=1"></script>
</body>
</html>
